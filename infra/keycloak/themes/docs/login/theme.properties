# Docs login theme.
#
# Inherits every FreeMarker template from `base`, which is unstyled and drives
# all of its markup through the class names below. That means the whole login
# experience — sign-in, password reset, OTP, error pages — picks up the
# product's look without a single template being rewritten.
#
# The palette in css/tokens.css is generated from packages/ui/styles.css by
# `pnpm theme:sync`, so the login page cannot drift away from the app.

parent=base
import=common/keycloak

styles=css/tokens.css css/login.css

# Credentials shown under the form. Delete this line outside the demo.
docsDemoHint=user@teste.com / senha123

# --- page shell -------------------------------------------------------------
kcHtmlClass=docs-html
kcBodyClass=docs-body
kcLoginClass=docs-page
kcHeaderClass=docs-header
kcHeaderWrapperClass=docs-header__wrapper
kcFormCardClass=docs-card
kcFormHeaderClass=docs-card__header
kcContentWrapperClass=docs-content
kcContentClass=docs-content

# --- form -------------------------------------------------------------------
kcFormClass=docs-form
kcFormGroupClass=docs-field
kcFormGroupErrorClass=docs-field--invalid
kcLabelClass=docs-label
kcLabelWrapperClass=docs-label-wrapper
kcInputClass=docs-input
kcInputWrapperClass=docs-input-wrapper
kcInputGroup=docs-input-group
kcInputErrorMessageClass=docs-error
kcInputHelperTextBeforeClass=docs-help
kcInputHelperTextAfterClass=docs-help
kcInputClassRadio=docs-choice
kcInputClassRadioInput=docs-choice__input
kcInputClassRadioLabel=docs-choice__label
kcInputClassCheckbox=docs-choice
kcInputClassCheckboxInput=docs-choice__input
kcInputClassCheckboxLabel=docs-choice__label
kcInputClassRadioCheckboxLabelDisabled=docs-choice--disabled
kcFormOptionsClass=docs-form-options
kcFormOptionsWrapperClass=docs-form-options__links
kcFormSettingClass=docs-form-settings
kcFormButtonsClass=docs-actions
kcFormPasswordVisibilityButtonClass=docs-password-toggle
kcFormPasswordVisibilityIconShow=docs-icon docs-icon--eye
kcFormPasswordVisibilityIconHide=docs-icon docs-icon--eye-off

# --- buttons ----------------------------------------------------------------
kcButtonClass=docs-button
kcButtonPrimaryClass=docs-button--primary
kcButtonDefaultClass=docs-button--secondary
kcButtonLargeClass=docs-button--lg
kcButtonBlockClass=docs-button--block

# --- feedback ---------------------------------------------------------------
kcAlertClass=docs-alert
kcAlertTitleClass=docs-alert__title
kcFeedbackErrorIcon=docs-icon docs-icon--error
kcFeedbackWarningIcon=docs-icon docs-icon--warning
kcFeedbackSuccessIcon=docs-icon docs-icon--success
kcFeedbackInfoIcon=docs-icon docs-icon--info
kcResetFlowIcon=docs-icon docs-icon--reset

# --- secondary areas --------------------------------------------------------
kcSignUpClass=docs-signup
kcInfoAreaWrapperClass=docs-info
kcFormSocialAccountListClass=docs-social
kcFormSocialAccountListGridClass=docs-social--grid
kcFormSocialAccountListButtonClass=docs-button docs-button--secondary docs-button--block
kcFormSocialAccountNameClass=docs-social__name

# --- locale switcher --------------------------------------------------------
kcLocaleMainClass=docs-locale
kcLocaleWrapperClass=docs-locale__wrapper
kcLocaleDropDownClass=docs-locale__dropdown
kcLocaleListClass=docs-locale__list
kcLocaleListItemClass=docs-locale__item
kcLocaleItemClass=docs-locale__link
