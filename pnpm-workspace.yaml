packages:
  - "apps/*"
  - "packages/*"

# Native/postinstall scripts we explicitly trust.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

# Storybook 10 ships as a synchronized set; allow the whole set through the
# registry cooldown together.
minimumReleaseAgeExclude:
  - "@storybook/*"
  - storybook
  - eslint-plugin-storybook
